name: CI
on: push
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - run: sudo apt-get update && sudo apt-get install -y shellcheck
    - uses: actions/checkout@v5
    - run: scripts/ci/shellcheck
  zsh:
    runs-on: ubuntu-latest
    steps:
    - run: sudo apt-get update && sudo apt-get install -y zsh
    - uses: actions/checkout@v5
    - run: scripts/ci/zsh
  vim:
    # macOS so the vimrc's /opt/homebrew paths resolve, as on the real machine
    runs-on: macos-latest
    steps:
    - run: brew install vim fzf
    - uses: actions/checkout@v5
    - run: >-
        curl -fLo ~/.local/share/vim/autoload/plug.vim --create-dirs
        https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
    - run: vim -N -es -i NONE -u vim/.config/vim/vimrc +'PlugInstall --sync' +qall
    - run: scripts/ci/vim
